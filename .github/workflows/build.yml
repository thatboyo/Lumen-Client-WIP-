name: Build Lumen Client

on:
  push:
    branches:
      - main
      - fix/minecraft-1.21.11-compatibility
  pull_request:
    branches:
      - main
      - fix/minecraft-1.21.11-compatibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build client
        run: gradle --no-daemon clean build

      - name: Upload built mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-client
          path: build/libs/*.jar
          if-no-files-found: error
